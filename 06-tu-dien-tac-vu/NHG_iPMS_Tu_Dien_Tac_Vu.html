<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHG iPMS — Từ điển Tác vụ (Task Dictionary)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#037236; --green-d:#025E2C; --green-50:#E8F4ED;
    --red:#ED2024; --red-50:#FDE8E8;
    --ink:#101214; --ink-2:#5F6668; --ink-3:#818285;
    --bg:#F8F6F1; --card:#fff; --canvas:#fff; --mist:#EEF3EF; --line:#DEE1E1; --line-2:#EEF0F0;
    --info:#0A6BB8; --info-50:#E2F0FB; --amber:#B86A00; --amber-50:#FBEFD9; --ai:#6D28A8; --ai-50:#F1E9FA;
    --shadow:0 4px 12px rgba(5,7,8,.07);
  }
  [data-theme="dark"]{
    --green:#2FA15D; --green-d:#3FB46C; --green-50:rgba(47,161,93,.16);
    --red:#F2585B; --red-50:rgba(242,88,91,.16);
    --ink:#ECEFEF; --ink-2:#A8AEAF; --ink-3:#7E8486;
    --bg:#0A0D0E; --card:#12181A; --canvas:#12181A; --mist:#0E1416; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
    --info:#4BA3E3; --info-50:rgba(75,163,227,.16); --amber:#E0A340; --amber-50:rgba(224,163,64,.16); --ai:#B98BE0; --ai-50:rgba(185,139,224,.16);
    --shadow:0 4px 14px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:'Be Vietnam Pro',system-ui,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;}
  .numeric{font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}

  header.top{display:flex; align-items:center; gap:14px; padding:12px 22px; background:var(--canvas); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10;}
  header.top .logo{height:30px;}
  header.top .ttl b{font-size:15px; font-weight:800; letter-spacing:-.2px;}
  header.top .ttl b span{color:var(--green);}
  header.top .ttl .s{font-size:10.5px; color:var(--ink-3);}
  .spacer{flex:1;}
  .iconbtn{display:inline-flex; align-items:center; gap:6px; height:34px; min-width:34px; padding:0 11px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink-2); font-size:12.5px; font-weight:600; transition:.15s;}
  .iconbtn:hover{background:var(--green); color:#fff; border-color:transparent;}

  .stats{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; padding:14px 22px 4px;}
  .chip{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 13px;}
  .chip .k{font-size:20px; font-weight:800; color:var(--green); line-height:1;}
  .chip .l{font-size:9.5px; color:var(--ink-3); margin-top:4px; font-weight:500; line-height:1.35;}

  .wrap{display:grid; grid-template-columns:380px 1fr; gap:14px; padding:12px 22px 28px; align-items:start;}
  @media(max-width:980px){ .wrap{grid-template-columns:1fr;} .stats{grid-template-columns:repeat(2,1fr);} }

  .panel{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);}
  .panel.tree{position:sticky; top:74px; max-height:calc(100vh - 90px); display:flex; flex-direction:column;}

  .toolbar{padding:12px 13px; border-bottom:1px solid var(--line-2);}
  .search{display:flex; align-items:center; gap:8px; background:var(--mist); border:1px solid var(--line-2); border-radius:10px; padding:8px 11px;}
  .search input{border:0; background:transparent; outline:none; font-family:inherit; font-size:13px; color:var(--ink); width:100%;}
  .filters{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .fchip{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:transparent; color:var(--ink-2);}
  .fchip.lvl-manual.active{background:var(--ink-3); color:#fff; border-color:transparent;}
  .fchip.lvl-assisted.active{background:var(--ai); color:#fff; border-color:transparent;}
  .fchip.lvl-automated.active{background:var(--amber); color:#fff; border-color:transparent;}
  .fchip.lvl-auto.active{background:var(--green); color:#fff; border-color:transparent;}

  .tree-scroll{overflow-y:auto; padding:8px 8px 12px;}
  .group>.ghead{display:flex; align-items:center; gap:8px; padding:9px 9px; border-radius:9px; cursor:pointer; font-weight:800; font-size:12.5px;}
  .group>.ghead:hover{background:var(--bg);}
  .group .gcode{font-size:9px; color:var(--ink-3); font-weight:700;}
  .chev{margin-left:auto; transition:transform .18s; color:var(--ink-3);}
  .group.collapsed .chev{transform:rotate(-90deg);}
  .group.collapsed .cluster{display:none;}
  .cluster{margin:2px 0 6px 10px; padding-left:8px; border-left:2px solid var(--line-2);}
  .clabel{font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:700; padding:6px 8px 3px;}
  .cell{display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:9px; cursor:pointer; font-size:12.5px; transition:background .12s;}
  .cell:hover{background:var(--bg);}
  .cell.active{background:var(--green-50); color:var(--green); font-weight:600;}
  .cell .dot{width:8px; height:8px; border-radius:99px; flex:0 0 auto;}
  .cell .cc{font-size:9px; color:var(--ink-3); margin-left:auto; font-weight:700;}
  .cell.hidden{display:none;}

  .detail{padding:20px 22px;}
  .dhead .code{font-size:11px; font-weight:800; color:var(--green); letter-spacing:.03em;}
  .dhead h1{font-size:22px; font-weight:800; letter-spacing:-.3px; margin:5px 0 2px;}
  .dhead .en{font-size:12.5px; color:var(--ink-3); font-style:italic;}
  .dhead .desc{font-size:12.5px; color:var(--ink-2); margin-top:8px; line-height:1.55;}
  .dhead .path{font-size:11px; color:var(--ink-3); margin-top:8px;}
  .badges{display:flex; flex-wrap:wrap; gap:7px; margin:13px 0 4px;}
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:99px;}
  .b-gray{background:var(--mist); color:var(--ink-2);} .b-green{background:var(--green-50); color:var(--green);}
  .b-info{background:var(--info-50); color:var(--info);} .b-amber{background:var(--amber-50); color:var(--amber);}
  .b-ai{background:var(--ai-50); color:var(--ai);} .b-red{background:var(--red-50); color:var(--red);}

  .sec{margin-top:12px; border:1px solid var(--line-2); border-radius:12px; overflow:hidden;}
  .sec>.shead{display:flex; align-items:center; gap:8px; padding:11px 14px; cursor:pointer; font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--green); background:var(--bg);}
  .sec.ai>.shead{color:var(--ai);}
  .sec .scount{margin-left:auto; font-size:9px; color:var(--ink-3); font-weight:700;}
  .sec .schev{transition:transform .18s; color:var(--ink-3);}
  .sec.closed .schev{transform:rotate(-90deg);}
  .sec.closed .sbody{display:none;}
  .sbody{padding:13px 15px;}
  .dl{display:grid; grid-template-columns:172px 1fr; gap:9px 16px;}
  @media(max-width:560px){ .dl{grid-template-columns:1fr;} .dl dt{margin-top:6px;} }
  .dl dt{font-size:11px; color:var(--ink-3); font-weight:600;}
  .dl dd{font-size:12.5px; color:var(--ink); line-height:1.5;}
  .dl dd b{font-weight:700;}
  .raci{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .raci .r{border:1px solid var(--line-2); border-radius:9px; padding:8px 10px;}
  .raci .r .t{font-size:9px; font-weight:800; letter-spacing:.04em; color:var(--ink-3); text-transform:uppercase;}
  .raci .r .v{font-size:12.5px; font-weight:600; margin-top:2px;}
  .tags{display:flex; flex-wrap:wrap; gap:5px;}
  .tag{font-size:10px; background:var(--mist); color:var(--ink-2); padding:2px 8px; border-radius:6px;}
  .impact .bar{height:10px; border-radius:99px; background:var(--mist); overflow:hidden; margin-top:5px;}
  .impact .bar>span{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--ai),var(--green));}
  .aibox{background:var(--ai-50); border:1px solid var(--ai); border-radius:12px; padding:12px 14px; margin-top:11px;}
  .aibox .ahead{display:flex; align-items:center; gap:8px; color:var(--ai); font-weight:800; font-size:12.5px; margin-bottom:5px;}
  .aibox p{font-size:11.5px; line-height:1.55; color:var(--ink);}

  .empty{padding:60px 22px; text-align:center; color:var(--ink-3);}
  .footer{padding:10px 22px; font-size:9.5px; color:var(--ink-3); border-top:1px solid var(--line-2); display:flex; justify-content:space-between;}
  .footer b{color:var(--green);}

  /* tabs */
  .tabs{display:flex; gap:7px; padding:12px 22px 0; flex-wrap:wrap;}
  .tab{font-size:13px; font-weight:700; padding:9px 16px; border-radius:11px; border:1px solid var(--line); background:transparent; color:var(--ink-2); transition:.15s;}
  .tab:hover{color:var(--ink);}
  .tab.active{background:var(--green); color:#fff; border-color:transparent;}

  /* backlog / workmap shared */
  .panel2{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin:14px 22px 28px;}
  .panel2 h2{font-size:16px; font-weight:800; letter-spacing:-.2px;}
  .panel2 .sub{font-size:11.5px; color:var(--ink-3); margin:4px 0 14px; line-height:1.5;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:10.5px; color:var(--ink-3); margin-bottom:10px;}
  .legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:middle;}
  table.t{width:100%; border-collapse:collapse; font-size:12px;}
  table.t thead th{text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-3); font-weight:700; padding:8px 10px; border-bottom:2px solid var(--line);}
  table.t tbody td{padding:9px 10px; border-bottom:1px solid var(--line-2); vertical-align:middle;}
  table.t tbody tr:hover{background:var(--bg);}
  table.t .rt{text-align:right;}
  .minibar{height:8px; width:84px; border-radius:99px; background:var(--mist); overflow:hidden; display:inline-block; vertical-align:middle; margin-right:6px;}
  .minibar>span{display:block; height:100%; background:linear-gradient(90deg,var(--ai),var(--green));}
  .rank{font-weight:800; color:var(--green); font-variant-numeric:tabular-nums;}

  .wmgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px; padding:14px 22px 28px;}
  .wmcard{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:16px 18px;}
  .wmcard h3{font-size:15px; font-weight:800;}
  .wmcard .role-sub{font-size:11px; color:var(--ink-3); margin-bottom:8px;}
  .stack{display:flex; height:9px; border-radius:99px; overflow:hidden; margin:8px 0 10px; background:var(--mist);}
  .stack>span{display:block; height:100%;}
  .celllist{font-size:11.5px; line-height:1.6; margin-top:8px;}
  .celllist .ci{display:flex; gap:8px; align-items:center; padding:3px 0; border-top:1px solid var(--line-2);}
  .celllist .ci .kc{margin-left:auto; font-size:9px; color:var(--ink-3); font-weight:700;}

  /* strategy lineage (trong cell detail) */
  .lineage{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:13px; padding:10px 13px; border-radius:11px; background:var(--green-50); border:1px solid var(--green); font-size:11px;}
  .lineage .lb{font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--green); width:100%; margin-bottom:1px;}
  .lineage .ln{font-weight:700;}
  .lineage .okr{color:var(--green);} .lineage .kgi{color:var(--info);} .lineage .kpi{color:var(--ai);} .lineage .cell{color:var(--ink);}
  .lineage .arr{color:var(--ink-3);}
  .lineage.warn{background:var(--amber-50); border-color:var(--amber); color:var(--amber);}

  /* cây mục tiêu (tab) */
  .okrnode{border:1px solid var(--green); border-radius:13px; overflow:hidden;}
  .okrhead{background:var(--green); color:#fff; font-weight:800; font-size:13.5px; padding:12px 15px;}
  .kginode{border-top:1px solid var(--line-2); padding:11px 15px 11px 20px;}
  .kgihead{font-weight:800; font-size:12.5px; color:var(--info); margin-bottom:5px;}
  .kgihead .cnt, .kpinode .cnt{font-size:10px; color:var(--ink-3); font-weight:600; margin-left:6px;}
  .kpinode{font-size:12px; padding:5px 0 5px 18px; color:var(--ink); border-left:2px solid var(--line-2); margin-left:4px;}
  .kpinode .kpc{font-weight:700; color:var(--ai); font-size:10.5px;}
  .kpinode.gap{color:var(--amber);}
  .gapw{color:var(--amber); font-weight:700; font-size:10.5px;}
  .gapbox{margin-top:13px; background:var(--amber-50); color:var(--amber); border-radius:10px; padding:10px 13px; font-size:11.5px; font-weight:600;}
</style>
</head>

<header class="top">
  <img class="logo" src="../design-system/public/logo.png" alt="NHG" onerror="this.onerror=null;this.src='../design-system/nhg-design-system-assets/logo.png'">

    <b>i<span>PMS</span> · Từ điển Tác vụ</b>

  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="expandBtn" title="Mở/gập tất cả mục">⤢</button>

  <button class="iconbtn" id="themeBtn" title="Giao diện">☾</button>

<div class="stats" id="stats"></div>

<div class="tabs" id="tabs">

<div id="view-dict" class="vbody">
<div class="wrap">
  <div class="panel tree">
    <div class="toolbar">
      <div class="search">

        <input id="search" placeholder="Tìm tác vụ, mã, vai trò, KPI…">
      </div>
      <div class="filters" id="filters">
        <button class="fchip lvl-manual" data-lvl="manual">Thủ công</button>
        <button class="fchip lvl-assisted" data-lvl="assisted">AI hỗ trợ</button>
        <button class="fchip lvl-automated" data-lvl="automated">AI tự động·duyệt</button>
        <button class="fchip lvl-auto" data-lvl="auto">Tự động</button>
      </div>
    </div>
    <div class="tree-scroll" id="tree"></div>
  </div>

  <div class="panel">
    <div id="detail"></div>
    <div class="footer">
      <span>NHG iPMS · Task Dictionary — <b>chuẩn hoá tác vụ → KPI → bằng chứng → AI</b></span>
      <span>One Data · One Platform · One NHG</span>
    </div>
  </div>
</div>
</div><!-- /view-dict -->

<div id="view-backlog" class="vbody" hidden></div>
<div id="view-workmap" class="vbody" hidden></div>
<div id="view-goals" class="vbody" hidden></div>

  const avg=Math.round(allCells.reduce((a,c)=>a+c.aiImpact,0)/allCells.length);
  const autoable=allCells.filter(c=>c.autoPot==="Cao"||c.autoPot==="TB").length;
  const items=[{k:allCells.length,l:"Task Cell · 40+ thuộc tính/cell"},{k:RAW.length,l:"Task Group"},{k:avg+"%",l:"AI Impact trung bình"},{k:(by.auto+by.automated),l:"Tác vụ AI tự động hoá"},{k:Math.round(autoable/allCells.length*100)+"%",l:"Tiềm năng tự động hoá"}];
  document.getElementById("stats").innerHTML=items.map(i=>`<div class="chip"><div class="k numeric">${i.k}</div><div class="l">${i.l}</div></div>`).join("");
}
function matchCell(c){ if(activeLvls.size&&!activeLvls.has(c.aiLevel))return false; if(!query)return true;
  return [c.code,c.name,c.en,c.owner,c.kpi,(c.tags||[]).join(" ")].join(" ").toLowerCase().includes(query.toLowerCase()); }
function renderTree(){
  const tree=document.getElementById("tree");

    const clusters=g.clusters.map(cl=>{
      const cells=cl.cells.map(c=>{const on=matchCell(c);const act=c.code===activeCode?" active":"";
        return `<div class="cell${act}${on?"":" hidden"}" data-code="${c.code}"><span class="dot" style="background:${DOT[c.aiLevel]}"></span><span>${lang==="vi"?c.name:c.en}</span><span class="cc">${c.code.split("-").pop()}</span></div>`;}).join("");
      return `<div class="cluster"><div class="clabel">${cl.code} · ${cl.name}</div>${cells}</div>`;}).join("");
    return `<div class="group" data-g="${g.code}"><div class="ghead"><span>${lang==="vi"?g.name:g.en}</span><span class="gcode">${g.code}</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></div>${clusters}</div>`;}).join("");
  tree.querySelectorAll(".ghead").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("collapsed"));
  tree.querySelectorAll(".cell").forEach(el=>el.onclick=()=>{activeCode=el.dataset.code;renderTree();renderDetail();});
}

    <div class="sub">Xếp hạng tác vụ nên tự động hoá trước = <b>Lộ trình (Now/Next/Later)</b> rồi tới <b>Điểm ưu tiên</b> (AI Impact × hệ số tiềm năng). Hỗ trợ "agent recommendation" cho đội AI.</div>
    <div class="legend"><span><b>Now</b>: ${cNow}</span><span><b>Next</b>: ${cNext}</span><span><b>Later</b>: ${cLater}</span></div>
    <table class="t"><thead><tr><th>#</th><th>Tác vụ</th><th>Nhóm</th><th>Mức AI hiện tại</th><th>AI Impact</th><th>Tiềm năng</th><th>Lộ trình</th><th>Agent gợi ý</th><th class="rt">Ưu tiên</th></tr></thead><tbody>
    ${rows.map((r,i)=>{const c=r.c,a=AI[c.aiLevel];return `<tr>
      <td class="rank">${i+1}</td>
      <td><b>${lang==="vi"?c.name:c.en}</b><div style="color:var(--ink-3);font-size:10px">${c.code} · ${c.kpiCode}</div></td>
      <td>${c.gcode}</td>
      <td>${bdg(a.cls,lang==="vi"?a.label:a.en)}</td>
      <td><span class="minibar"><span style="width:${c.aiImpact}%"></span></span><span class="numeric">${c.aiImpact}</span></td>
      <td>${c.autoPot}</td>
      <td>${stageBdg(c.autoStage)}</td>
      <td style="font-size:11px;color:var(--ink-2)">${c.agent}</td>
      <td class="rt"><b class="numeric">${r.score}</b></td></tr>`;}).join("")}
    </tbody></table></div>`;
}

/* ===== WorkMap theo vai trò ===== */
function renderWorkmap(){
  const byRole={}; allCells.forEach(c=>{(byRole[c.owner]=byRole[c.owner]||[]).push(c);});
  const cards=Object.entries(byRole).sort((a,b)=>b[1].length-a[1].length).map(([role,cells])=>{
    const kpis=[...new Set(cells.map(c=>c.kpiCode))];
    const dist={manual:0,assisted:0,automated:0,auto:0}; cells.forEach(c=>dist[c.aiLevel]++);
    const total=cells.length;
    const stack=Object.keys(dist).map(k=>dist[k]?`<span style="width:${dist[k]/total*100}%;background:${DOT[k]}" title="${AI[k].label}: ${dist[k]}"></span>`:"").join("");
    const list=cells.map(c=>`<div class="ci"><span class="dot" style="width:7px;height:7px;border-radius:99px;background:${DOT[c.aiLevel]}"></span><span>${lang==="vi"?c.name:c.en}</span><span class="kc">${c.kpiCode}</span></div>`).join("");
    return `<div class="wmcard">
      <h3>${role}</h3>
      <div class="role-sub">${total} Task Cell · ${kpis.length} KPI đo lường · gợi ý nền Role Scorecard</div>
      <div class="stack">${stack}</div>
      <div><b style="font-size:10.5px;color:var(--ink-3)">KPI gắn:</b> <div class="tags" style="margin-top:5px">${kpis.map(k=>`<span class="tag">${k}</span>`).join("")}</div></div>
      <div class="celllist">${list}</div>
    </div>`;
  }).join("");
  document.getElementById("view-workmap").innerHTML=`<div class="panel2" style="margin-bottom:0"><h2>👥 WorkMap theo vai trò</h2><div class="sub">Lật từ điển theo vị trí: mỗi vai trò gồm những Task Cell nào, đo bằng KPI nào, phân bố mức AI ra sao → nền để suy ra <b>Role Scorecard</b> & tính tải trong iPMS.</div></div><div class="wmgrid">${cards}</div>`;
}

/* ===== Cây mục tiêu (OKR → KGI → KPI → Task Cell) ===== */
function renderGoals(){
  const kgiKeys=Object.keys(KGI);
  const kgiKpis={}; kgiKeys.forEach(k=>kgiKpis[k]=[]);
  Object.entries(KPI_GOAL).forEach(([kpi,kgi])=>{ if(kgiKpis[kgi]) kgiKpis[kgi].push(kpi); });
  const unmapped=Object.keys(KPI_REG).filter(k=>k!=="—"&&!KPI_GOAL[k]);
  const totalCells=allCells.length;
  const tree=`<div class="okrnode">
    <div class="okrhead">${OKR.code} · ${lang==="vi"?OKR.name:OKR.en} <span style="font-weight:600;font-size:10px;opacity:.85">· ${kgiKeys.length} KGI · ${totalCells} Task Cell</span></div>
    ${kgiKeys.map(k=>{
      const kpis=kgiKpis[k];
      const cellCount=kpis.reduce((a,kp)=>a+(KPI_REG[kp]?KPI_REG[kp].cells.length:0),0);
      const body = kpis.length ? kpis.map(kp=>{
        const reg=KPI_REG[kp]; const nm=reg?reg.name:"(chưa có Task Cell)"; const cc=reg?reg.cells.length:0;
        return `<div class="kpinode ${cc?"":"gap"}"><span class="kpc">${kp}</span> ${nm} <span class="cnt">${cc} cell</span>${cc?"":' <span class="gapw">⚠ chưa có Task Cell</span>'}</div>`;
      }).join("") : `<div class="kpinode gap"><span class="gapw">⚠ KGI chưa có KPI</span></div>`;
      return `<div class="kginode"><div class="kgihead">${k} · ${lang==="vi"?KGI[k].name:KGI[k].en} <span class="cnt">${kpis.length} KPI · ${cellCount} Task Cell</span></div>${body}</div>`;
    }).join("")}
  </div>`;
  const gap = unmapped.length ? `<div class="gapbox">⚠ ${unmapped.length} KPI có Task Cell nhưng chưa gắn KGI: ${unmapped.join(", ")}</div>` : "";
  document.getElementById("view-goals").innerHTML=`<div class="panel2">
    <h2>🎯 Cây mục tiêu — OKR → KGI → KPI → Task Cell</h2>
    <div class="sub">Cascade chiến lược: từ mục tiêu lớn truy xuống tận tác vụ. Đo <b>xuôi</b> (lãnh đạo giao xuống) &amp; <b>ngược</b> (roll-up từ Task Cell qua KPI lên KGI/OKR). Cảnh báo gap nếu mục tiêu chưa có chỉ số/tác vụ.</div>
    ${tree}${gap}</div>`;
}

/* ===== chuyển tab ===== */
document.querySelectorAll(".tab").forEach(tb=>tb.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); tb.classList.add("active");
  const v=tb.dataset.v;
  document.getElementById("view-dict").hidden=v!=="dict";
  document.getElementById("view-backlog").hidden=v!=="backlog";
  document.getElementById("view-workmap").hidden=v!=="workmap";
  document.getElementById("view-goals").hidden=v!=="goals";
  if(v==="backlog") renderBacklog();
  if(v==="workmap") renderWorkmap();
  if(v==="goals") renderGoals();
});

/* init */
activeCode=allCells[0].code;   // tự mở Task Cell đầu tiên để thấy ngay lineage
renderStats();renderTree();renderDetail();
</script>
</body>
</html>
